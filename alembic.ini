[alembic]
script_location = migrations

# Puts the project root on sys.path so env.py can `import app`. Without this, the
# `alembic` console script fails with ModuleNotFoundError while `python -m alembic`
# works, because only the latter prepends the working directory.
prepend_sys_path = .

# The URL is taken from app.db.DATABASE_URL (env var DATABASE_URL) inside env.py.
